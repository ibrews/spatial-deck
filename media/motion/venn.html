<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bizarre Overlaps — motion</title>
<!-- PMRE 2026 motion graphic 2/6. Three crafts converge; each pairwise overlap is labeled with a VERIFIED career chapter
     (archviz years, theater planning at Fisher Dachs, live VR theater); center = XR-chitect. ?static / reduced-motion = final frame. -->
<style>
:root{--bg:#060810;--text:#f0f4ff;--dim:rgba(240,244,255,.5)}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:'Space Grotesk','Inter','Avenir Next','Helvetica Neue',system-ui,sans-serif}
svg{width:100%;height:100%;display:block}
.c{mix-blend-mode:screen;opacity:0;animation:in 1.6s cubic-bezier(.2,.8,.2,1) var(--t) forwards}
@keyframes in{from{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.8)}to{opacity:1;transform:none}}
.fade{opacity:0;animation:fade .9s ease var(--t,0s) forwards}
@keyframes fade{to{opacity:1}}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop 1s cubic-bezier(.2,1.4,.4,1) var(--t) forwards}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.lbl{font-size:40px;font-weight:600;letter-spacing:.18em;fill:var(--text)}
.ov{font-size:27px;font-weight:500;fill:var(--text);letter-spacing:.04em}
.cap{font-size:30px;fill:var(--dim);letter-spacing:.3em}
.core{font-size:44px;font-weight:700;fill:#060810;letter-spacing:.06em}
</style></head><body>
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" aria-label="Three overlapping circles: Architecture, Theater, Technology. Overlaps: archviz, theater planning, live VR theater. Center: XR-chitect.">
<defs>
  <radialGradient id="ga"><stop offset="0" stop-color="#00d4ff" stop-opacity=".55"/><stop offset="1" stop-color="#00d4ff" stop-opacity=".12"/></radialGradient>
  <radialGradient id="gt"><stop offset="0" stop-color="#f43f5e" stop-opacity=".55"/><stop offset="1" stop-color="#f43f5e" stop-opacity=".12"/></radialGradient>
  <radialGradient id="gx"><stop offset="0" stop-color="#a78bfa" stop-opacity=".55"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".12"/></radialGradient>
  <linearGradient id="core" x1="0" x2="1"><stop offset="0" stop-color="#00d4ff"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f43f5e"/></linearGradient>
</defs>
<g>
  <circle class="c" cx="820" cy="450" r="300" fill="url(#ga)" stroke="#00d4ff" stroke-width="3" style="--t:.3s;--dx:-500px;--dy:-120px"/>
  <circle class="c" cx="1100" cy="450" r="300" fill="url(#gt)" stroke="#f43f5e" stroke-width="3" style="--t:.8s;--dx:500px;--dy:-120px"/>
  <circle class="c" cx="960" cy="690" r="300" fill="url(#gx)" stroke="#a78bfa" stroke-width="3" style="--t:1.3s;--dx:0px;--dy:420px"/>
</g>
<text x="640" y="330" text-anchor="middle" class="lbl fade" style="--t:1.2s;fill:#00d4ff">ARCHITECTURE</text>
<text x="1280" y="330" text-anchor="middle" class="lbl fade" style="--t:1.6s;fill:#f43f5e">THEATER</text>
<text x="960" y="935" text-anchor="middle" class="lbl fade" style="--t:2.0s;fill:#a78bfa">TECHNOLOGY</text>
<!-- overlaps, each a real chapter of the story -->
<text x="960" y="365" text-anchor="middle" class="ov fade" style="--t:3.4s">theater planning</text>
<text x="770" y="690" text-anchor="middle" class="ov fade" style="--t:4.2s">archviz</text>
<text x="1150" y="690" text-anchor="middle" class="ov fade" style="--t:5.0s">live VR theater</text>
<g class="pop" style="--t:6.2s">
  <rect x="790" y="508" width="340" height="76" rx="38" fill="url(#core)"/>
  <text x="960" y="560" text-anchor="middle" class="core">XR-CHITECT</text>
</g>
<text x="960" y="1040" text-anchor="middle" class="cap fade" style="--t:7.2s">BIZARRE OVERLAPS</text>
</svg>
<script>
(function(){const P=new URLSearchParams(location.search),END=9;window.MOTION_END=END;
window.seek=function(s){document.getAnimations().forEach(a=>{a.pause();a.currentTime=s*1000;});};
if(matchMedia('(prefers-reduced-motion: reduce)').matches||P.has('static'))seek(END);else if(P.has('t'))seek(+P.get('t'));})();
</script>
</body></html>
