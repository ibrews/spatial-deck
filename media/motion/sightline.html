<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sightlines — motion</title>
<!-- PMRE 2026 motion graphic 3/6. What VR sightline testing is, in one picture: a generic theater section (illustrative,
     not a specific venue). Rays from every orchestra eye-point to the top of the set; rays the balcony blocks turn red; a
     headset "sits" in a blocked seat; the balcony is raised and every ray clears. Blockage is computed geometrically. -->
<style>
:root{--bg:#060810;--teal:#00d4ff;--rose:#f43f5e;--amber:#f59e0b;--text:#f0f4ff;--dim:rgba(240,244,255,.5)}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:'Space Grotesk','Inter','Avenir Next','Helvetica Neue',system-ui,sans-serif}
svg{width:100%;height:100%;display:block}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--d,1.2s) cubic-bezier(.6,0,.3,1) var(--t,0s) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fade{opacity:0;animation:fade .8s ease var(--t,0s) forwards}
@keyframes fade{to{opacity:1}}
.out{animation:out .6s ease var(--t) forwards}
@keyframes out{to{opacity:0}}
.ray{fill:none;stroke-width:2.5}
.ok{stroke:var(--teal);opacity:.75}
.bad{stroke:var(--teal);opacity:.75;animation:draw 1s cubic-bezier(.6,0,.3,1) var(--t) forwards,bad .5s ease var(--t2) forwards}
@keyframes bad{to{stroke:var(--rose);opacity:1}}
.balc{transform-box:view-box;animation:pull 1.4s cubic-bezier(.6,0,.2,1) var(--t) forwards}
@keyframes pull{to{transform:translateY(-90px)}}
.fix{opacity:0;animation:fade .5s ease var(--t) forwards}
.cap{font-size:44px;font-weight:600;fill:var(--text)}
.sub{font-size:26px;fill:var(--dim);letter-spacing:.24em}
.tag{font-size:22px;fill:var(--dim);letter-spacing:.2em}
</style></head><body>
<svg id="s" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" aria-label="Theater section diagram. Sightlines from orchestra seats to the top of the set; seats under the balcony are blocked until the balcony edge is pulled back.">
<g id="arch" stroke="rgba(240,244,255,.55)" stroke-width="3" fill="none">
  <path class="draw" pathLength="1" style="--t:.2s;--d:1.4s" d="M120 760 H 760 V 800 H 1820"/>
    <rect class="fade" style="--t:.9s" x="300" y="440" width="300" height="320" fill="rgba(245,158,11,.08)" stroke="rgba(245,158,11,.6)"/>
</g>
<text x="450" y="420" text-anchor="middle" class="tag fade" style="--t:1.1s;fill:#f59e0b">TOP OF THE SET</text>
<text x="440" y="850" text-anchor="middle" class="tag fade" style="--t:1.1s">STAGE</text>
<g id="balcony" class="balc" style="--t:9.6s">
  <path class="fade" style="--t:1.3s" d="M1150 628 H 1820 V 600 H 1150 Z" fill="rgba(240,244,255,.18)" stroke="rgba(240,244,255,.7)" stroke-width="3"/>
  <text x="1500" y="585" text-anchor="middle" class="tag fade" style="--t:1.4s">BALCONY</text>
</g>
<g id="rays"></g><g id="seats"></g>
<g id="hmd" class="fade" style="--t:6.6s">
  <rect x="-34" y="-16" width="68" height="32" rx="12" fill="#060810" stroke="#f0f4ff" stroke-width="3"/>
  <circle cx="-14" cy="0" r="7" fill="#f43f5e"/><circle cx="14" cy="0" r="7" fill="#f43f5e"/>
</g>
<text x="960" y="110" text-anchor="middle" class="cap fade out" id="c1" style="--t:2.0s">Can every seat see the show?</text>
<text x="960" y="110" text-anchor="middle" class="cap fade" id="c2" style="--t:7.0s;opacity:0">Sit in the seat before it&#8217;s built.</text>
<text x="960" y="1010" text-anchor="middle" class="sub fade" id="c3" style="--t:10.6s">FIND IT IN VR &#183; FIX IT IN THE DRAWINGS</text>
</svg>
<script>
(function(){
const NS='http://www.w3.org/2000/svg',T={x:450,y:440},Y0=628,Y1=600,X0=1150,RAISE=90;
const seats=[];for(let i=0;i<11;i++){const x=880+i*88,y=770-i*13;seats.push({x,y});}
// segment from eye to target crosses the balcony slab [X0..1820]x[Y1..Y0]?
function blocked(e,dy){for(let k=0;k<=400;k++){const u=k/400,x=e.x+(T.x-e.x)*u,y=e.y+(T.y-e.y)*u;if(x>=X0&&x<=1820&&y>=Y1-dy&&y<=Y0-dy)return true;}return false;}
const R=document.getElementById('rays'),S=document.getElementById('seats');let firstBad=null;
seats.forEach((e,i)=>{
  const b=blocked(e,0),after=blocked(e,RAISE);
  const p=document.createElementNS(NS,'path');p.setAttribute('d',`M${e.x} ${e.y} L ${T.x} ${T.y}`);p.setAttribute('pathLength','1');
  const t=(2.8+i*.22).toFixed(2)+'s';
  if(b){p.setAttribute('class','ray bad');p.style.cssText=`stroke-dasharray:1;stroke-dashoffset:1;--t:${t};--t2:5.4s`;if(!firstBad)firstBad=e;
    if(!after){const q=p.cloneNode();q.setAttribute('class','ray ok fix');q.style.cssText=`--t:${(11.0+i*.08).toFixed(2)}s`;R.appendChild(q);
      const hide=document.createElementNS(NS,'animate');}}
  else{p.setAttribute('class','ray ok draw');p.style.cssText=`--t:${t};--d:1s`;}
  R.appendChild(p);
  const c=document.createElementNS(NS,'circle');c.setAttribute('cx',e.x);c.setAttribute('cy',e.y);c.setAttribute('r',9);
  c.setAttribute('fill','#f0f4ff');c.setAttribute('class','fade');c.style.setProperty('--t',(2.4+i*.05).toFixed(2)+'s');S.appendChild(c);
  if(b){c.animate([{fill:'#f0f4ff'},{fill:'#f43f5e'}],{duration:500,delay:5400,fill:'forwards'});if(!after)c.animate([{fill:'#f43f5e'},{fill:'#f0f4ff'}],{duration:500,delay:11000,fill:'forwards',composite:'replace'});}
});
// once the balcony pulls back, blocked rays fade out under their cleared twins
R.querySelectorAll('.bad').forEach(p=>{p.animate([{opacity:1},{opacity:0}],{duration:500,delay:11000,fill:'forwards'});});
const h=document.getElementById('hmd'),f=firstBad||seats[seats.length-1];h.setAttribute('transform',`translate(${f.x} ${f.y-34})`);
document.getElementById('c1').style.animation='fade .8s ease 2s forwards, out .6s ease 6.4s forwards';
document.getElementById('c2').style.animation='fade .8s ease 7s forwards';
})();
(function(){const P=new URLSearchParams(location.search),END=13;window.MOTION_END=END;
window.seek=function(s){document.getAnimations().forEach(a=>{a.pause();a.currentTime=s*1000;});};
if(matchMedia('(prefers-reduced-motion: reduce)').matches||P.has('static'))seek(END);else if(P.has('t'))seek(+P.get('t'));})();
</script>
</body></html>
