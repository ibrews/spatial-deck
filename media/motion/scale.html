<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>One to One — motion</title>
<!-- PMRE 2026 motion graphic 6/6. The real-estate payoff: an ILLUSTRATIVE floor plan (not the Lake Austin plan) starts as a
     drawing on a page, grows to true scale around a person, and the person walks it. Captions are verified module lines. -->
<style>
:root{--bg:#060810;--teal:#00d4ff;--amber:#f59e0b;--text:#f0f4ff;--dim:rgba(240,244,255,.5)}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:'Space Grotesk','Inter','Avenir Next','Helvetica Neue',system-ui,sans-serif}
svg{width:100%;height:100%;display:block}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s cubic-bezier(.6,0,.3,1) var(--t,0s) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fade{opacity:0;animation:fade .8s ease var(--t,0s) forwards}
@keyframes fade{to{opacity:1}}
.fo{animation:fo .6s ease var(--t) forwards}@keyframes fo{to{opacity:0}}
#plan{transform-box:view-box;transform-origin:960px 560px;transform:scale(.32);animation:grow 2.6s cubic-bezier(.7,0,.2,1) 3.6s forwards}
@keyframes grow{to{transform:scale(1.55)}}
#page{animation:fo .8s ease 3.4s forwards}
.walk{offset-path:path('M975 1040 C 975 900, 990 700, 960 610 S 830 560, 780 540 S 640 420, 600 380');offset-rotate:0deg;offset-distance:0%;opacity:0;animation:fade .4s ease 6.4s forwards,walk 4s ease-in-out 6.6s forwards}
@keyframes walk{to{offset-distance:100%}}
.cap{font-size:50px;font-weight:600;fill:var(--text)}
.tag{font-size:24px;letter-spacing:.3em;fill:var(--dim)}
.room{font-size:13px;letter-spacing:.2em;fill:rgba(0,212,255,.7)}
</style></head><body>
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" aria-label="An illustrative floor plan grows from a small drawing to full scale around a person, who then walks through it.">
<rect id="page" x="660" y="330" width="600" height="460" rx="6" fill="rgba(240,244,255,.06)" stroke="rgba(240,244,255,.3)" stroke-width="2"/>
<g id="plan" fill="none" stroke="#00d4ff" stroke-width="5" stroke-linejoin="round">
  <path class="draw" pathLength="1" style="--t:.3s" d="M940 820 H 560 V 300 H 1360 V 820 H 1000"/>
  <path class="draw" pathLength="1" style="--t:.8s" d="M860 300 V 520 M 860 600 V 820 M 560 560 H 760 M 820 560 H 860 M 1100 300 V 460 M 1100 540 V 820 M 1100 640 H 1360"/>
  <g class="fade" style="--t:2.4s" stroke="none">
    <text x="710" y="440" text-anchor="middle" class="room">LIVING</text><text x="980" y="440" text-anchor="middle" class="room">KITCHEN</text>
    <text x="1230" y="480" text-anchor="middle" class="room">TERRACE</text><text x="710" y="700" text-anchor="middle" class="room">BEDROOM</text>
    <text x="1230" y="740" text-anchor="middle" class="room">BATH</text>
  </g>
</g>
<text x="960" y="880" text-anchor="middle" class="tag fade fo" style="--t:1.6s;animation:fade .8s ease 1.6s forwards,fo .5s ease 3.4s forwards">A PLAN ON A PAGE</text>
<!-- person, true scale relative to the grown plan -->
<g class="walk"><circle r="20" cy="-34" fill="#f59e0b"/><rect x="-18" y="-12" width="36" height="46" rx="14" fill="#f59e0b"/></g>
<text x="960" y="120" text-anchor="middle" class="cap fade" style="--t:6.8s">If you see a wall, you can touch a wall.</text>
<text x="960" y="1040" text-anchor="middle" class="tag fade" style="--t:9.6s">1 : 1 &#183; ILLUSTRATIVE PLAN</text>
</svg>
<script>
(function(){const P=new URLSearchParams(location.search),END=11.5;window.MOTION_END=END;
window.seek=function(s){document.getAnimations().forEach(a=>{a.pause();a.currentTime=s*1000;});};
if(matchMedia('(prefers-reduced-motion: reduce)').matches||P.has('static'))seek(END);else if(P.has('t'))seek(+P.get('t'));})();
</script>
</body></html>
